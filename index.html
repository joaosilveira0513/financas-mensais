function budgetDiff(){return current().budget.items.reduce((a,i)=>a+(i.actual==null?0:num(i.planned)-num(i.actual)),0)}
function receivablePending(){return current().receivables.reduce((a,r)=>{if(r.seriesId&&r.startMonth&&r.currentPart){let p=r.parts[r.currentPart-1];return a+(p?.received?0:num(p?.value))}return a+r.parts.reduce((x,p)=>x+(p.received?0:num(p.value)),0)},0)}
function cardCommitted(card){return calcCardTotal(card.id,viewMonth)}
function cardBreakdown(card){let ps=(current()?.purchases||[]).filter(p=>p.cardId===card.id);return {installments:ps.filter(p=>p.type==='installment'&&purchasePart(p,viewMonth)).reduce((a,p)=>a+purchaseMonthlyValue(p,viewMonth),0),purchases:ps.filter(p=>p.type==='one').reduce((a,p)=>a+purchaseMonthlyValue(p,viewMonth),0),subscriptions:ps.filter(p=>p.type==='subscription').reduce((a,p)=>a+purchaseMonthlyValue(p,viewMonth),0)}}
function renderNav(){document.getElementById('nav').innerHTML=NAV.map(n=>`<button type="button" class="navbtn ${screen===n[0]?'active':''}" data-nav="${n[0]}"><span>${n[1]}</span><span>${n[2]}</span></button>`).join('')}
function render(){renderNav();document.getElementById('fab').style.display=['bills','budget','cards','receivables'].includes(screen)&&!isClosed()?'block':'none';let main=document.getElementById('main');try{main.innerHTML=screen==='home'?home():screen==='bills'?bills():screen==='budget'?budget():screen==='cards'?cards():screen==='receivables'?receivables():history();bind()}catch(err){console.error('Falha ao renderizar tela',screen,err);main.innerHTML='<div class="card"><h3>Não foi possível abrir esta tela</h3><p class="muted">Os dados foram preservados. Tente novamente; se persistir, exporte um backup antes de atualizar.</p><p class="muted small">Detalhe técnico: '+esc(err?.message||String(err))+'</p><button class="primary" id="retryScreen">Tentar novamente</button></div>';document.getElementById('retryScreen').onclick=render}}
function monthBar(){return `<div class="monthbar"><button data-month="-1">‹</button><h2>${monthLabel(viewMonth)} ${isClosed()?'<span class="tag">🔒 Finalizado</span>':''}</h2><button data-month="1">›</button></div>`}
function home(){let m=current();return `${monthBar()}<div class="grid"><div class="card"><div class="row"><h3 style="margin:0">💵 Renda</h3>${!isClosed()?'<button class="ghost" data-edit-income>✏️</button>':''}</div><div class="row"><div><div class="muted small">Prevista</div><div class="big">${money(m.income.expected)}</div></div><div><div class="muted small">Real</div><div class="big">${m.income.actual==null?'—':money(m.income.actual)}</div></div></div></div><div class="card" data-nav="bills"><h3>📋 Contas</h3><div class="big">${money(billTotal())}</div><div class="muted small">${m.bills.filter(b=>!b.paid).length} pendente(s)</div></div><div class="card" data-nav="cards"><h3>💳 Cartões</h3><div class="big">${money(state.cards.reduce((a,c)=>a+cardCommitted(c),0))}</div><div class="muted small">${state.cards.length} cartão(ões)</div></div><div class="card" data-nav="budget"><h3>🛒 Orçamento</h3><div class="big">${money(m.budget.amount)}</div><div class="muted small">${m.budget.items.length} distribuição(ões)</div></div></div><div class="grid" style="margin-top:12px"><div class="card" data-nav="receivables"><h3>💰 A receber</h3><div class="big">${money(receivablePending())}</div><div class="muted small">pendente</div></div><div class="card"><h3>📅 Status</h3><div class="summaryline"><span class="pill">${m.closed?'🔒 Fechado':'🟢 Em andamento'}</span><span class="pill">${m.bills.filter(b=>b.paid).length}/${m.bills.length} contas pagas</span></div></div></div>${!isClosed()?`<div class="card" style="margin-top:12px"><div class="row"><div><b>Finalizar ${monthLabel(viewMonth)}?</b><div class="muted small">A renda real precisa estar preenchida antes do fechamento.</div></div><button class="primary" data-action="close-month">Finalizar mês</button></div></div>`:''}`}
function categoryGroups(){let names=['Faturas de crédito',...state.categories.map(c=>c.name)];return [...new Set(names)]}
function renderBillItem(b){let edit=!b.sourceCard&&!isClosed()?`<button class="iconbtn" data-edit-bill="${b.id}">✏️</button>`:'';let del=!b.sourceCard&&!isClosed()?`<button class="danger" data-delete-bill="${b.id}">Excluir</button>`:'';return `<div class="item ${b.paid?'paid':''}"><div class="row"><div><b>${esc(b.name)}</b><div class="muted small">Vencimento dia ${b.dueDay}${b.approx?' · aproximado':''}${b.sourceCard?' · gerado pelo cartão':''}</div></div><div class="row"><b>${money(b.amount)}</b>${edit}</div></div><div class="row" style="margin-top:8px"><label class="checkbox"><input type="checkbox" data-pay-bill="${b.id}" ${b.paid?'checked':''} ${isClosed()?'disabled':''}> ${b.paid?'Paga':'Marcar como paga'}</label>${del}</div></div>`}
function bills(){let m=current();let groups=categoryGroups();let body='';for(const cat of groups){let arr=m.bills.filter(b=>b.category===cat);if(!arr.length)continue;body+=`<div class="sectionhead"><h3>${esc(cat)}</h3></div>`;for(const b of arr)body+=renderBillItem(b)}return `${monthBar()}<div class="card"><div class="row"><div><div class="muted small">Total das contas</div><div class="big">${money(billTotal())}</div></div><div class="summaryline"><span class="pill">${m.bills.filter(b=>b.paid).length} pagas</span><span class="pill">${m.bills.filter(b=>!b.paid).length} pendentes</span></div></div></div>${body}`}

function budget(){let m=current();return `${monthBar()}<div class="card"><div class="row"><div><div class="muted small">Orçamento mensal</div><div class="big">${money(m.budget.amount)}</div></div>${!isClosed()?`<button class="ghost" data-edit-budget>✏️ Editar</button>`:''}</div></div><div class="sectionhead"><h3>Distribuições</h3>${!isClosed()?`<button class="ghost" data-add-budget>＋ Adicionar</button>`:''}</div>${m.budget.items.length?m.budget.items.map(i=>`<div class="item"><div class="row"><div><b>${esc(i.name)}</b></div><div class="row"><div>${i.actual!=null&&num(i.actual)!==num(i.planned)?`<span class="strike">${money(i.planned)}</span>`:money(i.planned)}</div>${!isClosed()?`<button class="iconbtn" data-edit-budget-item="${i.id}">✏️</button>`:''}</div></div><div class="row" style="margin-top:8px"><div class="muted small">Real: ${i.actual==null?'—':money(i.actual)}</div>${!isClosed()?`<button class="danger" data-delete-budget-item="${i.id}">Excluir</button>`:''}</div></div>`).join(''):`<div class="empty">Nenhuma distribuição cadastrada.</div>`}<div class="card" style="margin-top:12px"><div class="muted small">Divergência acumulada</div><div class="diff ${budgetDiff()>=0?'ok':'bad'}">${budgetDiff()>=0?'+':''}${money(budgetDiff())}</div><div class="muted small">Somente visualização. Não altera as contas.</div></div>`}
function purchaseList(cardId,type){let items=(current()?.purchases||[]).filter(p=>p&&p.cardId===cardId&&p.type===type&&(type!=='installment'||purchasePart(p,viewMonth)!==null));if(!items.length)return '<div class="empty">Nenhum item cadastrado.</div>';return items.map(p=>{let part=type==='installment'?purchasePart(p,viewMonth):null;let amount=purchaseMonthlyValue(p,viewMonth);let detail=type==='installment'?`Parcela ${part}/${Math.max(1,Number(p.parts)||1)} · ${money(amount)} por mês`:type==='subscription'?'Mensal': 'Compra única';return `<div class="item"><div class="row"><div><b>${esc(p.name||'Item sem nome')}</b><div class="muted small">${detail}</div></div><div class="row"><b>${money(amount)}</b>${!isClosed()?`<div class="actions"><button class="iconbtn" data-edit-purchase="${esc(p.id)}" aria-label="Editar item">✏️</button><button class="danger" data-delete-purchase="${esc(p.id)}">Excluir</button></div>`:''}</div></div></div>`}).join('')}
function cards(){return `${monthBar()}<div class="sectionhead"><h3>Cartões</h3>${!isClosed()?`<button class="ghost" data-add-card>＋ Adicionar cartão</button>`:''}</div>${visibleCards(viewMonth).length?visibleCards(viewMonth).map(c=>cardView(c)).join(''):`<div class="empty">Nenhum cartão cadastrado.</div>`}`}
function cardView(c){c.limits??={installments:0,purchases:0,subscriptions:0};c.bankLimit=Number(c.bankLimit)||0;c.dueDay=Number(c.dueDay)||1;let d=cardBreakdown(c),total=cardCommitted(c),pct=c.bankLimit?Math.min(100,total/c.bankLimit*100):0,collapsed=!!collapsedCards[c.id];return `<div class="card" style="margin-bottom:12px"><div class="row"><div><h3>💳 ${esc(c.name)}</h3><div class="muted small">Vencimento dia ${c.dueDay}</div></div><div class="actions">${!isClosed()?`<button class="iconbtn" data-edit-card="${c.id}">✏️</button><button class="danger" data-delete-card="${c.id}">Excluir</button>`:''}<button class="ghost" data-toggle-card="${c.id}" title="${collapsed?'Expandir':'Retrair'}">${collapsed?'▼ Expandir':'▲ Retrair'}</button></div></div>${collapsed?`<div class="row" style="margin-top:10px"><div><div class="muted small">Fatura</div><div class="big">${money(total)}</div></div><div style="text-align:right"><div class="muted small">Limite bancário</div><b>${money(c.bankLimit)}</b></div></div>`:`<div class="row" style="margin-top:10px"><div><div class="muted small">Fatura</div><div class="big">${money(total)}</div></div><div style="text-align:right"><div class="muted small">Limite bancário</div><b>${money(c.bankLimit)}</b><div class="muted small">Comprometido ${money(total)} · Disponível ${money(Math.max(0,c.bankLimit-total))}</div></div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="sectionhead"><h3>Assinaturas</h3>${!isClosed()?`<button class="ghost" data-add-purchase="${c.id}" data-type="subscription">＋</button>`:''}</div>${purchaseList(c.id,'subscription')}<div class="sectionhead"><h3>Parcelas <span class="tag">${money(d.installments)} / ${money(c.limits.installments)}</span></h3>${!isClosed()?`<button class="ghost" data-add-purchase="${c.id}" data-type="installment">＋</button>`:''}</div>${purchaseList(c.id,'installment')}<div class="sectionhead"><h3>Compras <span class="tag">${money(d.purchases)} / ${money(c.limits.purchases)}</span></h3>${!isClosed()?`<button class="ghost" data-add-purchase="${c.id}" data-type="one">＋</button>`:''}</div>${purchaseList(c.id,'one')}<div class="divider"></div><div class="summaryline"><span class="tag ${d.installments>c.limits.installments?'bad':'ok'}">Parcelas ${d.installments<=c.limits.installments?'🟢':'🔴'}</span><span class="tag ${d.purchases>c.limits.purchases?'bad':'ok'}">Compras ${d.purchases<=c.limits.purchases?'🟢':'🔴'}</span><span class="tag ${d.subscriptions>c.limits.subscriptions?'bad':'ok'}">Assinaturas ${d.subscriptions<=c.limits.subscriptions?'🟢':'🔴'}</span></div>`}</div>`}
function receivables(){let m=current();return `${monthBar()}<div class="card"><div class="muted small">Total pendente</div><div class="big">${money(receivablePending())}</div></div><div class="sectionhead"><h3>A receber</h3>${!isClosed()?`<button class="ghost" data-add-rec>＋ Adicionar</button>`:''}</div>${m.receivables.length?m.receivables.map(r=>{let indices=r.seriesId&&r.startMonth&&r.currentPart?[r.currentPart-1]:r.parts.map((_,i)=>i);return `<div class="card" style="margin-bottom:10px"><div class="row"><div><h3>${esc(r.person)}</h3><div class="muted small">${esc(r.description)}${r.seriesId&&r.startMonth&&r.currentPart?` · Parcela ${r.currentPart}/${r.parts.length}`:''}</div></div>${!isClosed()?`<div class="actions"><button class="iconbtn" data-edit-rec="${r.id}">✏️</button><button class="danger" data-delete-rec="${r.id}">Excluir</button></div>`:''}</div>${indices.map(i=>{let p=r.parts[i];return `<div class="row" style="margin-top:10px"><label class="checkbox"><input type="checkbox" data-rec-part="${r.id}" data-part="${i}" ${p.received?'checked':''} ${isClosed()?'disabled':''}> ${p.received?'Recebido':'Pendente'} — ${money(p.value)}</label><span class="muted small">${p.date||''}</span></div>`}).join('')}</div>`}).join(''):`<div class="empty">Nenhum valor a receber.</div>`}`}
function history(){let months=Object.keys(state.months).sort().reverse();return `<div class="sectionhead"><h2 style="margin:0">Histórico</h2></div>${months.map(k=>{let m=state.months[k];return `<div class="card ${m.closed?'locked':''}" style="margin-bottom:10px"><div class="row"><div><h3>${monthLabel(k)} ${m.closed?'🔒':''}</h3><div class="summaryline"><span class="pill">Renda real: ${m.income.actual==null?'—':money(m.income.actual)}</span><span class="pill">Contas: ${money(m.bills.reduce((a,b)=>a+num(b.amount),0))}</span><span class="pill">Orçamento: ${money(m.budget.amount)}</span></div></div><button class="ghost" data-view-history="${k}">Ver</button></div></div>`}).join('')}`}
function openModal(html){const modal=document.getElementById('modal');document.getElementById('modalBox').innerHTML=html;modal.classList.add('show');document.querySelectorAll('#modalBox [data-close]').forEach(b=>b.onclick=(ev)=>{ev.preventDefault();closeModal()});}
function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('modalBox').innerHTML=''}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function confirmAction(title,text,ok,cb){openModal(`<h2>${esc(title)}</h2><p class="muted">${esc(text)}</p><div class="modalactions"><button class="ghost" data-close>Cancelar</button><button class="danger" id="confirmOk">${esc(ok)}</button></div>`);document.getElementById('confirmOk').onclick=()=>{closeModal();cb()}}
function bind(){document.querySelectorAll('[data-edit-income]').forEach(x=>x.onclick=incomeModal);document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{let n=addMonths(viewMonth,Number(b.dataset.month));ensureMonth(n);propagateToMonth(n);syncCardBills(n);viewMonth=n;render()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);document.getElementById('fab').onclick=()=>fabAction();
document.querySelectorAll('[data-pay-bill]').forEach(x=>x.onchange=()=>{let b=current().bills.find(b=>b.id===x.dataset.payBill);if(b){b.paid=x.checked;save();render()}});
document.querySelectorAll('[data-delete-bill]').forEach(x=>x.onclick=()=>confirmAction('Excluir conta?', 'Ela será removida deste mês e dos próximos, sem alterar o histórico.', 'Excluir',()=>{deleteRecurring('bills',x.dataset.deleteBill);render()}));document.querySelectorAll('[data-edit-bill]').forEach(x=>x.onclick=()=>billModal(x.dataset.editBill));
document.querySelectorAll('[data-edit-budget]').forEach(x=>x.onclick=budgetModal);document.querySelectorAll('[data-add-budget]').forEach(x=>x.onclick=()=>budgetItemModal());document.querySelectorAll('[data-edit-budget-item]').forEach(x=>x.onclick=()=>budgetItemModal(x.dataset.editBudgetItem));document.querySelectorAll('[data-delete-budget-item]').forEach(x=>x.onclick=()=>confirmAction('Excluir distribuição?','Ela será removida deste mês e não altera o histórico.','Excluir',()=>{current().budget.items=current().budget.items.filter(i=>i.id!==x.dataset.deleteBudgetItem);save();render()}));
document.querySelectorAll('[data-add-card]').forEach(x=>x.onclick=cardModal);document.querySelectorAll('[data-toggle-card]').forEach(x=>x.onclick=()=>{collapsedCards[x.dataset.toggleCard]=!collapsedCards[x.dataset.toggleCard];render()});document.querySelectorAll('[data-edit-card]').forEach(x=>x.onclick=()=>cardModal(x.dataset.editCard));document.querySelectorAll('[data-delete-card]').forEach(x=>x.onclick=()=>confirmAction('Excluir cartão?', 'O cartão deixará de aparecer a partir deste mês; históricos permanecem intactos.','Excluir',()=>{let c=state.cards.find(c=>c.id===x.dataset.deleteCard);if(c){c.deletedFrom=viewMonth;for(const [k,m] of Object.entries(state.months)){if(k>=viewMonth&&!m.closed){m.bills=m.bills.filter(b=>b.sourceCard!==c.id);m.purchases=m.purchases.filter(p=>p.cardId!==c.id);syncCardBills(k)}}save();render()}}));document.querySelectorAll('[data-add-purchase]').forEach(x=>x.onclick=()=>purchaseModal(null,x.dataset.addPurchase,x.dataset.type));document.querySelectorAll('[data-edit-purchase]').forEach(x=>x.onclick=()=>purchaseModal(x.dataset.editPurchase));document.querySelectorAll('[data-delete-purchase]').forEach(x=>x.onclick=()=>confirmAction('Excluir item do cartão?','A alteração vale para o mês atual e os futuros; histórico fechado não muda.','Excluir',()=>{deletePurchase(x.dataset.deletePurchase);render()}));
document.querySelectorAll('[data-add-rec]').forEach(x=>x.onclick=recModal);document.querySelectorAll('[data-edit-rec]').forEach(x=>x.onclick=()=>recModal(x.dataset.editRec));document.querySelectorAll('[data-delete-rec]').forEach(x=>x.onclick=()=>confirmAction('Excluir A receber?','O registro será removido deste mês e dos próximos, sem alterar o histórico.','Excluir',()=>{let r=current().receivables.find(r=>r.id===x.dataset.deleteRec);current().receivables=current().receivables.filter(r=>r.id!==x.dataset.deleteRec);if(r?.seriesId){for(const [k,m] of Object.entries(state.months)){if(k>viewMonth&&!m.closed)m.receivables=m.receivables.filter(x=>x.seriesId!==r.seriesId)}}save();render()}));document.querySelectorAll('[data-rec-part]').forEach(x=>x.onchange=()=>{let r=current().receivables.find(r=>r.id===x.dataset.recPart);let p=r?.parts[Number(x.dataset.part)];if(p){p.received=x.checked;p.date=x.checked?new Date().toLocaleDateString('pt-BR'):null;save();render()}});document.querySelectorAll('[data-view-history]').forEach(x=>x.onclick=()=>{viewMonth=x.dataset.viewHistory;screen='home';render()});document.querySelectorAll('[data-action="close-month"]').forEach(x=>x.onclick=closeMonth)}
function fabAction(){if(screen==='bills')billModal();if(screen==='budget')budgetItemModal();if(screen==='cards')cardModal();if(screen==='receivables')recModal()}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function incomeModal(){let m=current();openModal(`<h2>Renda de ${monthLabel(viewMonth)}</h2><form id="form">${field('Renda prevista','expected',m.income.expected??0,'number','step="0.01" min="0"')}${field('Renda real','actual',m.income.actual??'','number','step="0.01" min="0"')}<div class="muted small">A renda real deve ser preenchida antes de finalizar o mês.</div><div class="modalactions"><button type="button" class="ghost" data-close>Cancelar</button><button class="primary">Salvar</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),expected=num(f.get('expected')),raw=f.get('actual'),actual=raw===''?null:num(raw);if(expected<0||(actual!=null&&actual<0)){toast('Informe valores válidos.');return}m.income.expected=round2(expected);m.income.actual=actual==null?null:round2(actual);save();closeModal();render()}}
function billModal(id){let b=id?current().bills.find(x=>x.id===id):null;if(b?.sourceCard)return;openModal(`<h2>${b?'Editar':'Adicionar'} conta</h2><form id="form"><div class="formgrid">${field('Nome','name',b?.name||'')}${field('Valor','amount',b?.amount??'','number','step="0.01" min="0"')}${field('Vencimento','dueDay',b?.dueDay||'1','number','min="1" max="31"')}${field('Categoria','category',b?.category||state.categories[0]?.name||'Casa')}</div><label class="checkbox"><input type="checkbox" name="approx" ${b?.approx?'checked':''}> Valor aproximado</label><label class="checkbox" style="margin-top:10px"><input type="checkbox" name="recurring" ${b?.recurring?.active?'checked':''}> Repetir todo mês</label><div class="modalactions"><button type="button" class="ghost" data-close>Cancelar</button><button class="primary">Salvar</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let val=num(f.get('amount'));if(!f.get('name')||val<0||val>1e9){toast('Preencha os dados corretamente.');return}if(b){Object.assign(b,{name:f.get('name').trim(),amount:round2(val),dueDay:Math.min(31,Math.max(1,Number(f.get('dueDay')))),category:f.get('category').trim()||'Outras',approx:f.has('approx'),recurring:{active:f.has('recurring'),recurrenceId:b?.recurring?.recurrenceId||uid('rec')}})}else{current().bills.push({id:uid('bill'),name:f.get('name').trim(),amount:round2(val),dueDay:Number(f.get('dueDay')),category:f.get('category').trim()||'Outras',approx:f.has('approx'),paid:false,recurring:{active:f.has('recurring'),recurrenceId:b?.recurring?.recurrenceId||uid('rec')}})}save();syncRecurringBillFuture(current().bills.find(x=>x.id===b?.id)||current().bills.at(-1));closeModal();render()}}
function budgetModal(){let m=current();openModal(`<h2>Orçamento mensal</h2><form id="form">${field('Valor do orçamento','amount',m.budget.amount,'number','step="0.01" min="0"')}<div class="modalactions"><button type="button" class="ghost" data-close>Cancelar</button><button class="primary">Salvar</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v=num(f.get('amount'));if(v<0){toast('Valor inválido.');return}if(m.budget.items.reduce((a,i)=>a+num(i.planned),0)>v){toast('O orçamento não pode ficar abaixo das distribuições atuais.');return}m.budget.amount=round2(v);save();closeModal();render()}}
function budgetItemModal(id){let i=id?current().budget.items.find(x=>x.id===id):null;openModal(`<h2>${i?'Editar':'Adicionar'} distribuição</h2><form id="form">${field('Nome','name',i?.name||'')}${field('Valor planejado','planned',i?.planned??'','number','step="0.01" min="0"')}${field('Valor real','actual',i?.actual??'','number','step="0.01" min="0"')}<div class="modalactions"><button type="button" class="ghost" data-close>Cancelar</button><button class="primary">Salvar</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),pl=num(f.get('planned')),act=f.get('actual')===''?null:num(f.get('actual'));if(!name||pl<0||(act!=null&&act<0)){toast('Preencha os dados corretamente.');return}let total=current().budget.items.filter(x=>x.id!==id).reduce((a,x)=>a+num(x.planned),0)+pl;if(total>current().budget.amount){toast('A soma das distribuições não pode ultrapassar o orçamento.');return}if(i)Object.assign(i,{name,planned:round2(pl),actual:act==null?null:round2(act)});else current().budget.items.push({id:uid('bud'),name,planned:round2(pl),actual:act==null?null:round2(act)});save();closeModal();render()}}
function cardModal(id){let raw=id?state.cards.find(x=>x.id===id):null;let c=raw?cardForMonth(raw,viewMonth):null;openModal(`<h2>${c?'Editar':'Adicionar'} cartão</h2><form id="form">${field('Nome','name',c?.name||'')}${field('Limite bancário','bankLimit',c?.bankLimit??'','number','step="0.01" min="0"')}${field('Dia de vencimento','dueDay',c?.dueDay||'1','number','min="1" max="31"')}<div class="divider"></div><div class="muted small">Limites pessoais mensais</div><div class="formgrid">${field('Parcelas','installments',c?.limits?.installments??'0','number','step="0.01" min="0"')}${field('Compras','purchases',c?.limits?.purchases??'0','number','step="0.01" min="0"')}${field('Assinaturas','subscriptions',c?.limits?.subscriptions??'0','number','step="0.01" min="0"')}</div><div class="modalactions"><button type="button" class="ghost" data-close>Cancelar</button><button class="primary">Salvar</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),bank=num(f.get('bankLimit'));if(!name||bank<0){toast('Preencha os dados corretamente.');return}let data={name,bankLimit:round2(bank),dueDay:Math.min(31,Math.max(1,Number(f.get('dueDay')))),limits:{installments:num(f.get('installments')),purchases:num(f.get('purchases')),subscriptions:num(f.get('subscriptions'))}};if(raw){raw.versions??=[];raw.versions.push({...data,fromMonth:viewMonth});raw.deletedFrom=null}else{state.cards.push({id:uid('card'),createdMonth:viewMonth,deletedFrom:null,versions:[{...data,fromMonth:viewMonth}]})}for(const [k] of Object.entries(state.months)){if(k>=viewMonth&&!state.months[k].closed)syncCardBills(k)}save();closeModal();render()}}

function purchaseModal(id,forcedCard,forcedType){let p=id?current().purchases.find(x=>x.id===id):null;let cardId=p?.cardId||forcedCard||state.cards[0]?.id;let type=p?.type||forcedType||'one';openModal(`<h2>${p?'Editar':'Adicionar'} item</h2><form id="form"><div class="formgrid"><div class="field"><label>Cartão</label><select name="cardId">${state.cards.map(c=>`<option value="${c.id}" ${c.id===cardId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Tipo</label><select name="type"><option value="one" ${type==='one'?'selected':''}>Compra</option><option value="installment" ${type==='installment'?'selected':''}>Parcelada</option><option value="subscription" ${type==='subscription'?'selected':''}>Assinatura</option></select></div></div>${field('Descrição','name',p?.name||'')}${field('Valor total','value',p?.totalValue??p?.value??'','number','step="0.01" min="0"')}${field('Número de parcelas','parts',p?.parts??1,'number','min="1" max="120"')}${field('Data da compra','date',p?.date||viewMonth+'-01','date')}<div class="field"><label>Primeira fatura</label><input name="firstMonth" type="month" value="${esc(p?.firstMonth||viewMonth)}"></div><div class="muted small">A fatura escolhida define o mês de entrada, independentemente da data da compra.</div><div class="modalactions"><button type="button" class="ghost" data-close>Cancelar</button><button class="primary">Salvar</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),v=num(f.get('value')),parts=Math.max(1,Math.min(120,Number(f.get('parts'))||1)),t=f.get('type'),fm=f.get('firstMonth')||viewMonth;if(!name||v<0){toast('Preencha os dados corretamente.');return}let monthly=t==='installment'?round2(v/parts):v;let data={cardId:f.get('cardId'),name,value:v,type:t,parts,firstMonth:fm,date:f.get('date')||fm+'-01',monthlyValue:monthly,totalValue:v,seriesId:p?.seriesId||uid('series')};if(p){Object.assign(p,data);syncPurchaseFuture(p)}else{let np={id:uid('pur'),...data};current().purchases.push(np);syncPurchaseFuture(np)}syncCardBills(viewMonth);save();closeModal();render()}}
function recModal(id){let r=id?current().receivables.find(x=>x.id===id):null;let existingParts=r?.parts?.length||1;openModal(`<h2>${r?'Editar':'Adicionar'} A receber</h2><form id="form">${field('Pessoa','person',r?.person||'')}${field('Descrição','description',r?.description||'')}${field('Valor total','total',r?.total??'','number','step="0.01" min="0"')}${field('Número de parcelas','parts',existingParts,'number','min="1" max="120"')}<div class="muted small">Se houver parcelamento, a 1ª parcela fica neste mês e as seguintes são lançadas automaticamente nos próximos meses.</div><div class="modalactions"><button type="button" class="ghost" data-close>Cancelar</button><button class="primary">Salvar</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),person=f.get('person').trim(),description=f.get('description').trim(),total=num(f.get('total')),n=Math.max(1,Math.min(120,Number(f.get('parts'))||1));if(!person||total<0){toast('Preencha os dados corretamente.');return}let old=r?.parts||[],partValue=round2(total/n),parts=Array.from({length:n},(_,i)=>({value:i===n-1?round2(total-partValue*(n-1)):partValue,received:old[i]?.received||false,date:old[i]?.date||null}));let startMonth=r?.startMonth||viewMonth,seriesId=r?.seriesId||uid('recseries');let data={person,description,total:round2(total),parts,seriesId,startMonth,currentPart:monthsDiff(startMonth,viewMonth)+1};if(r)Object.assign(r,data);else current().receivables.push({id:uid('rec'),...data});syncReceivableFuture(data,r?.id);save();closeModal();render()}}
function syncReceivableFuture(r,sourceId){if(!r?.seriesId||!r?.startMonth)return;for(const [k,m] of Object.entries(state.months)){if(k<=viewMonth||m.closed)continue;let part=monthsDiff(r.startMonth,k)+1;let existing=m.receivables.find(x=>x.seriesId===r.seriesId);let should=part>=1&&part<=r.parts.length;if(should){if(existing){existing.person=r.person;existing.description=r.description;existing.total=r.total;existing.startMonth=r.startMonth;existing.seriesId=r.seriesId;existing.parts=r.parts.map(p=>({...p}));existing.currentPart=part}else m.receivables.push({id:uid('rec'),person:r.person,description:r.description,total:r.total,seriesId:r.seriesId,startMonth:r.startMonth,currentPart:part,parts:r.parts.map(p=>({...p}))})}else if(existing)m.receivables=m.receivables.filter(x=>x!==existing)}}
function syncRecurringBillFuture(bill){if(!bill?.recurring?.recurrenceId)return;let rid=bill.recurring.recurrenceId;for(const [k,m] of Object.entries(state.months)){if(k<=viewMonth||m.closed)continue;let existing=m.bills.find(x=>x.recurring?.recurrenceId===rid);if(bill.recurring.active){if(existing){Object.assign(existing,{name:bill.name,amount:bill.amount,dueDay:bill.dueDay,category:bill.category,approx:bill.approx,recurring:{active:true,recurrenceId:rid}})}else{m.bills.push({...structuredClone(bill),id:uid('bill'),paid:false})}}else if(existing)m.bills=m.bills.filter(x=>x!==existing)}}
function removeRecurringBillFuture(rid){if(!rid)return;for(const [k,m] of Object.entries(state.months)){if(k<=viewMonth||m.closed)continue;m.bills=m.bills.filter(x=>x.recurring?.recurrenceId!==rid)}}
function syncPurchaseFuture(p){if(!p?.seriesId||p.type==='one')return;for(const [k,m] of Object.entries(state.months)){if(k<=viewMonth||m.closed)continue;let should=p.type==='subscription'||(p.type==='installment'&&monthsDiff(p.firstMonth,k)>=0&&monthsDiff(p.firstMonth,k)<p.parts);let ex=m.purchases.find(x=>x.seriesId===p.seriesId);if(should){if(ex)Object.assign(ex,{cardId:p.cardId,name:p.name,value:p.value,type:p.type,parts:p.parts,firstMonth:p.firstMonth,date:p.date,monthlyValue:p.monthlyValue,totalValue:p.totalValue});else m.purchases.push({...structuredClone(p),id:uid('pur')})}else if(ex)m.purchases=m.purchases.filter(x=>x!==ex);delete m.statementOverrides;syncCardBills(k)}}
function removePurchaseSeriesFuture(seriesId){for(const [k,m] of Object.entries(state.months)){if(k<=viewMonth||m.closed)continue;m.purchases=m.purchases.filter(x=>x.seriesId!==seriesId);delete m.statementOverrides;syncCardBills(k)}}
function deleteRecurring(collection,id){let m=current();let item=m[collection].find(x=>x.id===id);m[collection]=m[collection].filter(x=>x.id!==id);if(collection==='bills'&&item?.recurring?.recurrenceId)removeRecurringBillFuture(item.recurring.recurrenceId);save()}
function deletePurchase(id){let p=current().purchases.find(x=>x.id===id);current().purchases=current().purchases.filter(x=>x.id!==id);if(p?.seriesId)removePurchaseSeriesFuture(p.seriesId);syncCardBills(viewMonth);save()}

function closeMonth(){let m=current();if(m.income.actual==null){toast('Informe a renda real antes de finalizar.');return}confirmAction('Finalizar mês?',`Depois disso, ${monthLabel(viewMonth)} ficará bloqueado e não poderá ser editado.`,'Finalizar',()=>{m.closed=true;let next=addMonths(viewMonth,1);ensureMonth(next);propagateToMonth(next);syncCardBills(next);viewMonth=next;state.currentMonth=next;screen='home';save();render();toast(`${monthLabel(addMonths(next,-1))} finalizado.`)})}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();else if(e.target.closest('[data-close]')){e.preventDefault();closeModal()}});document.getElementById('settingsBtn').onclick=()=>settingsModal();function settingsModal(){openModal(`<h2>Configurações</h2><div class="stack"><button class="ghost" id="exportBtn">📤 Exportar backup</button><label class="ghost" style="display:block;text-align:center;cursor:pointer">📥 Importar backup<input id="importInput" type="file" accept="application/json" style="display:none"></label><div class="item"><div class="row"><b>Categorias de contas</b><button class="ghost" id="addCategory">＋</button></div>${state.categories.map(c=>`<div class="row" style="margin-top:8px"><span>${esc(c.name)}</span><span class="actions"><button class="iconbtn" data-cat-edit="${c.id}">✏️</button><button class="danger" data-cat-delete="${c.id}">×</button></span></div>`).join('')}</div><div class="item"><b>Dados locais</b><div class="muted small">Os dados ficam neste navegador. Faça backups regularmente.</div></div></div><div class="modalactions"><button class="primary" data-close>Fechar</button></div>`);document.getElementById('exportBtn').onclick=exportBackup;document.getElementById('importInput').onchange=importBackup;document.getElementById('addCategory').onclick=()=>categoryModal();document.querySelectorAll('[data-cat-edit]').forEach(x=>x.onclick=()=>categoryModal(x.dataset.catEdit));document.querySelectorAll('[data-cat-delete]').forEach(x=>x.onclick=()=>{let c=state.categories.find(c=>c.id===x.dataset.catDelete);confirmAction('Excluir categoria?',`A categoria "${c?.name||''}" será removida das configurações. Contas históricas não serão alteradas.`,'Excluir',()=>{state.categories=state.categories.filter(c=>c.id!==x.dataset.catDelete);save();closeModal();settingsModal()})})}
function categoryModal(id){let c=id?state.categories.find(x=>x.id===id):null;openModal(`<h2>${c?'Editar':'Adicionar'} categoria</h2><form id="form">${field('Nome','name',c?.name||'')}<div class="modalactions"><button type="button" class="ghost" data-close>Cancelar</button><button class="primary">Salvar</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let name=new FormData(e.target).get('name').trim();if(!name){toast('Informe um nome.');return}if(c)c.name=name;else state.categories.push({id:uid('cat'),name});save();closeModal();settingsModal()}}

function exportBackup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='financas-mensais-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup exportado.')}
function importBackup(e){let file=e.target.files?.[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let incoming=normalize(JSON.parse(r.result));if(!incoming.months||!incoming.cards)throw new Error();confirmAction('Importar backup?','Os dados atuais deste navegador serão substituídos pelo backup escolhido.','Importar',()=>{state=incoming;viewMonth=state.currentMonth;screen='home';save();closeModal();render();toast('Backup restaurado.')})}catch(err){toast('Arquivo de backup inválido.')}};r.readAsText(file)}
// Navigation uses delegation so bottom buttons remain reliable after every render.
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-nav]');if(!b||!document.getElementById('nav').contains(b))return;e.preventDefault();e.stopPropagation();const next=b.dataset.nav;if(!NAV.some(n=>n[0]===next))return;screen=next;render()});
// Home nav cards need binding via generic data-nav, done in bind.
// Initialize current month and card bills without rewriting seeded statement overrides.
ensureMonth(viewMonth);if(startupNeedsAdvance)propagateToMonth(viewMonth);state.currentMonth=viewMonth;syncCardBills(viewMonth);save();render();
</script></body></html>
